name: VocabReader
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: com.vocabreader
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
packages:
  ptts:
    url: https://github.com/gradium-ai/xn-ptts
    exactVersion: 0.4.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_TESTING_SEARCH_PATHS: YES
targets:
  VocabReader:
    type: application
    platform: iOS
    sources:
      - path: VocabReader
        createIntermediateGroups: true
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N4TQ2P9B46
        CURRENT_PROJECT_VERSION: 11
        MARKETING_VERSION: "1.0.3"
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabreader.app
        INFOPLIST_FILE: VocabReader/Info.plist
        # 内置 Phonon 模型的脚本需要写入 App 包内的目录。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Debug 从本机 scripts/serve-phonon-models.sh 下载；Release 从 Cloudflare R2（scripts/upload-phonon-models.sh 上传）下载。
        Debug:
          PHONON_MODELS_BASE_URL: http://localhost:8765
        Release:
          PHONON_MODELS_BASE_URL: https://assets.wenmsg.fun/phonon/31m-en/v0.4.0
    postCompileScripts:
      # Phonon 模型只在 Debug 且本地已获取时内置，便于真机调试；正式包改为在设置页按需下载。
      # 模型不进 git，用 scripts/fetch-phonon-models.sh 获取，没有时照常构建。
      - name: Embed Phonon Models (Debug)
        basedOnDependencyAnalysis: false
        script: |
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/PhononModels"
          if [ "$CONFIGURATION" = "Debug" ] && [ -f "$SRCROOT/PhononModels/bundle.json" ]; then
            rsync -a --delete "$SRCROOT/PhononModels/" "$DEST/"
          else
            rm -rf "$DEST"
          fi
    dependencies:
      - package: ptts
        product: ptts
  VocabReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VocabReaderTests
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabreader.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VocabReader.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VocabReader
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VocabReader
